version: '3.8'

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: builder
    container_name: tchat-web-builder
    volumes:
      - web-dist:/output
    command: sh -c "npm run build && cp -r dist/* /output/ && sleep infinity"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tchat-server
    restart: unless-stopped
    volumes:
      - ./server/chatterCount.json:/root/chatterCount.json
    networks:
      - tchat-network

  caddy:
    image: caddy:2-alpine
    container_name: tchat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - web-dist:/web/dist
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tchat-network
    depends_on:
      - web
      - server

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: tchat-tunnel
    restart: unless-stopped
    # The environment variable is pulled from your .env file
    environment:
      - CLOUDFLARE_TOKEN=${CLOUDFLARE_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - tchat-network
    depends_on:
      - caddy

networks:
  tchat-network:
    driver: bridge

volumes:
  web-dist:
  caddy_data:
  caddy_config: